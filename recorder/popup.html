<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 280px; margin: 12px; }
      button { width: 100%; margin: 4px 0; padding: 6px; }
      #toggle.on { background: #d33; color: #fff; }
      #status { margin: 8px 0; }
      .row { display: flex; gap: 4px; }
      .row input { flex: 1; }
      .row button { width: auto; }
    </style>
  </head>
  <body>
    <div id="status">…</div>
    <button id="toggle">Start recording</button>
    <button id="snapshot">Snapshot page now</button>
    <div class="row">
      <input id="marker" placeholder="Marker, e.g. adding second line" />
      <button id="addMarker">Add</button>
    </div>
    <button id="export">Export JSON</button>
    <button id="clear">Clear log</button>
    <script src="popup.js"></script>
  </body>
</html>
